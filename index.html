<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top 10 Anime 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #ff0055; --bg: #050608; --card-inner: #16161a; }
        body { background-color: var(--bg); color: white; font-family: 'Poppins', sans-serif; margin: 0; }
        header { text-align: center; padding: 60px 20px; background: linear-gradient(to bottom, #1a0b1c, var(--bg)); }
        h1 { font-family: 'Bebas Neue'; font-size: 4rem; color: var(--primary); margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 30px; padding: 40px; max-width: 1400px; margin: auto; }
        
        .card { background: var(--card-inner); border-radius: 20px; overflow: hidden; border: 1px solid #333; transition: 0.3s; }
        .card-img { width: 100%; height: 350px; object-fit: cover; }
        .info { padding: 20px; }
        
        /* כוכבי דירוג */
        .stars { cursor: pointer; color: #ffd700; font-size: 1.5rem; margin-bottom: 10px; }
        .star { transition: 0.2s; }
        .star:hover { transform: scale(1.3); }

        .watch-btn { display: block; background: var(--primary); color: white; text-align: center; padding: 12px; border-radius: 10px; text-decoration: none; font-weight: bold; margin-top: 10px; }
        .watch-btn:hover { background: #ff2e73; }
    </style>
</head>
<body>

    <header><h1>TOP 10 ANIME 2026</h1></header>

    <div class="grid" id="anime-grid">
        <div class="card">
            <img src="https://image.tmdb.org/t/p/w500/v9977U87YpD67I87YpD67I87YpD.jpg" class="card-img" alt="Anime">
            <div class="info">
                <h2>Solo Leveling S2</h2>
                <div class="stars" onclick="rate(this)">★☆☆☆☆</div>
                <a href="https://www.crunchyroll.com/series/G0BEWMXWG/solo-leveling" target="_blank" class="watch-btn">WATCH EPISODE 1</a>
            </div>
        </div>
        </div>

    <script>
        function rate(element) {
            element.innerHTML = '★★★★★'; // פשוט ומהיר
            alert('Rated successfully!');
        }
    </script>
</body>
</html>
