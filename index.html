<script>
        document.addEventListener('DOMContentLoaded', () => {
            // עובר על כל הכרטיסיות של האנימה
            const allCards = document.querySelectorAll('.card');
            
            allCards.forEach((card, cardIndex) => {
                const stars = card.querySelectorAll('.star');
                const dbKey = 'forex_anime_rating_' + cardIndex; // השם שבו זה נשמר בזיכרון
                
                // 1. כשהאתר עולה - בודק אם יש דירוג שכבר שמרנו בעבר
                const savedRating = localStorage.getItem(dbKey);
                if (savedRating) {
                    applyRating(stars, savedRating);
                }

                // 2. כשלוחצים על כוכב - צובע ושומר למסד הנתונים המקומי
                stars.forEach((star, starIndex) => {
                    star.addEventListener('click', () => {
                        const ratingValue = starIndex + 1;
                        applyRating(stars, ratingValue);
                        localStorage.setItem(dbKey, ratingValue); // שמירה!
                    });
                });
            });

            // פונקציה שצובעת את הכוכבים
            function applyRating(starsArray, ratingValue) {
                starsArray.forEach((s, i) => {
                    if (i < ratingValue) {
                        s.style.color = '#ffd700'; // זהב
                        s.style.transform = 'scale(1.1)';
                    } else {
                        s.style.color = '#555'; // אפור
                        s.style.transform = 'scale(1)';
                    }
                });
            }
        });
    </script>
